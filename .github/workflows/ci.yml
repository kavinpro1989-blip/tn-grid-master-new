name: TN Grid Master CI

on:
  push:
    branches: [ main, new-version ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Syntax & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check ui.js
          echo "✅ All JavaScript syntax checks passed"

      - name: Run test suite
        run: node tests/runner.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build standalone bundle
        run: python3 build_standalone.py

      - name: Verify standalone was generated
        run: |
          test -f standalone_simulation.html && echo "✅ standalone_simulation.html verified" || exit 1
          wc -c standalone_simulation.html
